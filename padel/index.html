<style>
:root{--bg:#0b0b0c;--panel:#151517;--line:#2a2a2e;--ink:#f3f3f1;--mute:#9a9aa1;--acc:#d7ff3a;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:0 20px max(40px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}

/* hero */
.hero{position:relative;margin:0 -20px;aspect-ratio:4/5;max-height:58svh;overflow:hidden;background:#0d1530}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 82%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,12,.35) 0,rgba(11,11,12,0) 22%,rgba(11,11,12,0) 58%,var(--bg) 100%);pointer-events:none}
.hd{position:relative;margin:-34px 0 0;z-index:1}
.over{margin:0 0 8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:600}
.hd h1{margin:0;font-size:clamp(30px,8.6vw,38px);line-height:1.04;letter-spacing:-.03em;font-weight:750}
.hd h1 em{font-style:normal;color:var(--acc)}
.hd .sub{margin:6px 0 0;color:var(--mute);font-size:17px}

/* details */
.info{margin:26px 0 0;padding:20px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.when{margin:0 0 12px;font-size:18px;font-weight:600;letter-spacing:-.005em}
.arrive{margin:0 0 18px;padding:13px 15px;border:1px solid var(--acc);border-radius:12px;background:rgba(215,255,58,.08)}
.arrive b{display:block;color:var(--acc);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.arrive span{display:block;color:var(--ink);opacity:.82;font-size:15px;margin-top:3px}
.where{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.where b{display:block;font-size:16px;font-weight:600}
.where small{display:block;color:var(--mute);font-size:15px}
.where i{font-style:normal;color:var(--acc);font-weight:600;font-size:14px;white-space:nowrap}
.map{position:relative;margin:14px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#1a1b1e;aspect-ratio:16/10}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;filter:invert(.9) hue-rotate(180deg) saturate(.55) brightness(.95) contrast(.92)}

/* form */
.rsvp-h{margin:26px 0 2px;font-size:18px;font-weight:600;letter-spacing:-.005em}
label,.lbl{display:block;font-size:13px;color:var(--mute);margin:18px 0 7px;letter-spacing:.02em}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;appearance:none;-webkit-appearance:none}
input:focus{outline:none;border-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;padding:13px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.seg input:checked+label{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.seg input:focus-visible+label{outline:2px solid var(--acc);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.submit{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;margin:24px auto 0;border:0;border-radius:12px;padding:0 16px;font:700 16px/1 inherit;color:#0b0b0c;background:var(--acc);cursor:pointer;overflow:hidden;
  transition:width .38s cubic-bezier(.4,0,.2,1),border-radius .38s cubic-bezier(.4,0,.2,1),transform .12s ease,opacity .2s}
.submit:active{transform:scale(.98)}
.submit[disabled]{cursor:default}
.submit .spin{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(11,11,12,.25);border-top-color:#0b0b0c;animation:spin .7s linear infinite}
.submit .chk{display:none;width:24px;height:24px;fill:none;stroke:#0b0b0c;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.submit .chk path{stroke-dasharray:24;stroke-dashoffset:24}
.submit.is-loading .spin{display:block}
.submit.is-done{width:50px;border-radius:999px;padding:0}
.submit.is-done .t,.submit.is-done .spin{display:none}
.submit.is-done .chk{display:block}
.submit.is-done .chk path{animation:draw .34s .3s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
.wait{color:var(--mute);font-size:13px;text-align:center;margin-top:10px;min-height:1em;opacity:0;transition:opacity .3s}
.wait.on{opacity:1}
.err{color:#ff8a8a;font-size:14px;margin-top:12px}
.err:empty{display:none}
.err button{display:inline;background:none;border:0;padding:0;margin-left:6px;color:var(--ink);font:600 14px/1.4 inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.shake{animation:shake .32s ease}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* fullscreen thank-you */
.wrap>*{transition:opacity .4s ease}
body.cg-out .wrap>*:not(#rsvp),body.cg-out #formbox{opacity:0}
body.cg-on .wrap>*:not(#rsvp),body.cg-on #formbox{display:none!important}
body.cg-on .wrap{padding:0}
.thanks{position:relative;min-height:100vh;min-height:100svh;margin:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;text-align:center;isolation:isolate}
.thanks .ph{position:absolute;top:0;left:0;right:0;height:calc(100% - 190px);z-index:-1;opacity:0;transform:scale(1.06)}
.thanks .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 78%;display:block}
.thanks .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,12,.3) 0,rgba(11,11,12,0) 20%,rgba(11,11,12,0) 62%,var(--bg) 100%)}
.thanks .tx{padding:0 24px max(34px,calc(env(safe-area-inset-bottom) + 20px))}
.thanks .mark{width:46px;height:46px;margin:0 auto 16px;border-radius:50%;border:1.5px solid var(--acc);display:flex;align-items:center;justify-content:center;background:rgba(11,11,12,.4)}
.thanks .mark svg{width:20px;height:20px;fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.thanks .mark path{stroke-dasharray:24;stroke-dashoffset:24}
.thanks h3{font-size:clamp(30px,8.6vw,38px);line-height:1.06;letter-spacing:-.03em;margin:0 0 10px;font-weight:750}
.thanks p{color:var(--mute);margin:0;font-size:17px}
.again{background:none;border:0;padding:8px 4px;margin-top:14px;color:var(--acc);font:600 15px/1 inherit;cursor:pointer}
.thanks .r{opacity:0;transform:translateY(12px)}
.thanks.in .ph{animation:phin 1.1s cubic-bezier(.2,.7,.2,1) forwards}
.thanks.in .r{animation:rin .55s cubic-bezier(.2,.7,.2,1) forwards}
.thanks.in .r1{animation-delay:.35s}.thanks.in .r2{animation-delay:.5s}.thanks.in .r3{animation-delay:.62s}.thanks.in .r4{animation-delay:.74s}
.thanks.in .mark path{animation:draw .4s .7s ease-out forwards}
@keyframes phin{to{opacity:1;transform:none}}
@keyframes rin{to{opacity:1;transform:none}}
@media (min-width:520px){.thanks{position:fixed;inset:0;margin:0}.thanks .tx{max-width:480px;margin:0 auto;width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .submit.is-loading .spin{animation:spin 1.6s linear infinite!important;animation-duration:1.6s!important;animation-iteration-count:infinite!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <img src="court-800.webp" srcset="court-800.webp 800w, court-1200.webp 1200w" sizes="(max-width:480px) 100vw, 480px" width="800" height="1159" alt="Rakieta do padla i piłki na niebieskim korcie" fetchpriority="high" decoding="async">
  </div>
  <header class="hd">
    <p class="over">Zaproszenie · 13. urodziny</p>
    <h1>Danik wbija <em>trzynastkę</em>.</h1>
    <p class="sub">Zapraszamy na padla.</p>
  </header>

  <section class="info">
    <p class="when">Sobota, 17 października, 13:00–16:00</p>
    <p class="arrive"><b>Przyjdźcie o 12:20–12:30</b><span>żeby spokojnie się przebrać. Gramy od 13:00.</span></p>
    <a class="where" href="https://www.google.com/maps/search/?api=1&amp;query=SanPadel%2C%20ul.%20Przedsi%C4%99biorc%C3%B3w%201%2C%2005-500%20Mysiad%C5%82o" target="_blank" rel="noopener noreferrer">
      <span><b>SanPadel</b><small>ul. Przedsiębiorców 1, 05-500 Mysiadło</small></span><i>Mapa →</i>
    </a>
    <div class="map"><iframe src="https://www.google.com/maps?q=SanPadel+Przedsi%C4%99biorc%C3%B3w+1+Mysiad%C5%82o&amp;z=15&amp;output=embed" title="Mapa: SanPadel, ul. Przedsiębiorców 1, Mysiadło" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
  </section>

  <section id="rsvp">
    <div id="formbox">
    <form id="f" novalidate>
      <h2 class="rsvp-h">Potwierdź obecność</h2>
      <label for="name">Imię i nazwisko</label>
      <input type="text" id="name" name="name" maxlength="80" autocomplete="name" required>
      <span class="lbl" id="comingLbl">Będziesz?</span>
      <div class="seg" role="radiogroup" aria-labelledby="comingLbl">
        <input type="radio" name="coming" id="c-yes" value="yes"><label for="c-yes">Tak</label>
        <input type="radio" name="coming" id="c-no" value="no"><label for="c-no">Nie</label>
      </div>
      <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <button class="submit" id="send" type="submit"><span class="spin" aria-hidden="true"></span><span class="t">Wyślij</span><svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div class="wait" id="wait" aria-hidden="true">Jeszcze chwilka…</div>
      <div class="err" id="err" role="alert" aria-live="assertive"></div>
    </form>
    </div>
    <div id="thanks" class="thanks" hidden aria-live="polite"></div>
  </section>
</main>

<script>
(function(){
  var ENDPOINT='https://script.google.com/macros/s/AKfycbxekC8Gj0AUYWyh1JTaj5tyMg1aQoHm_O82LQ1pndiIMhKAl2_I5AwQWb-RAb6CVKZIQg/exec';
  var SITE_KEY='tp-REQPKbguGjfRDkrw'; // anti-spam filter, not a secret
  var $=function(id){return document.getElementById(id)};

  // wake the Apps Script early (cold start can take ~10 s); GET only returns "ok"
  var ENDPOINT_WARM=function(){try{fetch(ENDPOINT,{mode:'no-cors',cache:'no-store'}).catch(function(){})}catch(e){}};
  if(document.readyState==='complete')setTimeout(ENDPOINT_WARM,800);else addEventListener('load',function(){setTimeout(ENDPOINT_WARM,800)});
  var warmed=false;document.addEventListener('focusin',function(){if(!warmed){warmed=true;ENDPOINT_WARM()}});

  var f=$('f'),err=$('err'),btn=$('send'),bt=btn.querySelector('.t'),wait=$('wait'),thx=$('thanks');
  var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var busy=false,pending=null,waitT=null;
  function coming(){var c=f.querySelector('input[name=coming]:checked');return c?c.value:null}
  f.addEventListener('change',function(){err.textContent=''});
  function rid(){var a=new Uint8Array(10);crypto.getRandomValues(a);return 'rsvp'+Array.prototype.map.call(a,function(x){return x.toString(36)}).join('').slice(0,16)}
  function shake(el){if(RM)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
  function invalid(msg,el){err.textContent=msg;shake(el);if(el.focus&&el.tagName==='INPUT')el.focus();}
  function setLoading(on){busy=on;btn.disabled=on;btn.classList.toggle('is-loading',on);btn.setAttribute('aria-busy',on);bt.textContent=on?'Wysyłanie':'Wyślij';
    clearTimeout(waitT);wait.classList.remove('on');if(on)waitT=setTimeout(function(){wait.classList.add('on')},2500);}
  function fail(msg){setLoading(false);err.innerHTML='';err.appendChild(document.createTextNode(msg));
    var r=document.createElement('button');r.type='button';r.textContent='Spróbuj ponownie';r.onclick=function(){send(pending)};err.appendChild(r);
    err.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});}
  function success(r){clearTimeout(waitT);wait.classList.remove('on');btn.classList.remove('is-loading');btn.classList.add('is-done');bt.textContent='Wysłano';
    var y=r.coming==='yes';
    thx.className='thanks '+(y?'yes':'no');
    thx.innerHTML='<div class="ph" aria-hidden="true"><img src="court-1200.webp" srcset="court-800.webp 800w, court-1200.webp 1200w" sizes="100vw" alt=""></div>'
      +'<div class="tx"><div class="mark r r1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'
      +(y?'<h3 class="r r2">Jesteś na liście!</h3><p class="r r3">Do zobaczenia 17 października o 12:20.</p>'
         :'<h3 class="r r2">Szkoda!</h3><p class="r r3">Dziękujemy za odpowiedź.</p>')
      +'<button class="again r r4" type="button" id="again">Zmień odpowiedź</button></div>';
    var B=document.body;
    setTimeout(function(){
      B.classList.add('cg-out');
      setTimeout(function(){
        B.classList.remove('cg-out');B.classList.add('cg-on');
        thx.hidden=false;thx.classList.remove('in');void thx.offsetWidth;thx.classList.add('in');
        window.scrollTo(0,0);
        $('again').onclick=reopen;},RM?0:420);
    },RM?150:900);}
  function reopen(){var B=document.body;thx.hidden=true;thx.classList.remove('in');B.classList.remove('cg-on','cg-out');btn.classList.remove('is-done');setLoading(false);pending=null;
    var r=$('rsvp');if(r&&r.scrollIntoView)r.scrollIntoView({block:'start'});f.elements.name.focus({preventScroll:true});}
  // one request per attempt; slow or unreadable attempts are retried silently (up to 2x) with the same id (the script dedupes by id)
  function post(job,ms,cb){var done=false,ctl=window.AbortController?new AbortController():null;
    var to=setTimeout(function(){fin('timeout');if(ctl)ctl.abort()},ms);
    function fin(r){if(done)return;done=true;clearTimeout(to);cb(r)}
    var opt={method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:job.body,redirect:'follow',cache:'no-store'};if(ctl)opt.signal=ctl.signal;
    fetch(ENDPOINT,opt).then(function(r){return r.text()}).then(function(t){t=String(t).trim();fin(t==='ok'||t==='dup'?'ok':(t==='rate'?'rate':'bad'))})
      .catch(function(e){if(done)return;
        // CORS hiccup: resend without reading the reply (same id, so no duplicate row)
        fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:job.body}).then(function(){fin('ok')}).catch(function(){fin('net')});});}
  var TRIES=[15000,20000,25000];
  function send(job){if(!job)return;err.textContent='';setLoading(true);var ended=false;
    function end(r){if(ended)return;ended=true;
      if(r==='ok')success(job);else if(r==='rate')fail('Za dużo prób naraz. Spróbuj za minutę.');else if(r==='net')fail('Brak połączenia.');else if(r==='timeout')fail('Serwer nie odpowiada.');else fail('Coś poszło nie tak.');}
    (function attempt(i){post(job,TRIES[i],function(r){if(r==='ok'||r==='rate'||i>=TRIES.length-1)return end(r);setTimeout(function(){attempt(i+1)},600);});})(0);}
  f.addEventListener('submit',function(e){e.preventDefault();if(busy)return;err.textContent='';
    var name=f.elements.name.value.trim(),c=coming();
    if(!name){invalid('Wpisz imię i nazwisko.',f.elements.name);return}
    if(!c){invalid('Zaznacz „Tak” albo „Nie”.',f.querySelector('.seg'));return}
    var yes=c==='yes',people=yes?1:0;
    if(f.elements.website.value){success({name:name,coming:c});return}
    var p={k:SITE_KEY,v:1,id:rid(),ts:new Date().toISOString(),slug:'urodziny-daniil-13',subject:'Urodziny RSVP',topic:name.slice(0,80),mode:'other',
      variant:yes?'TAK':'NIE',score:people,extra:{kind:'rsvp',child:'RSVP',coming:yes?'TAK':'NIE',people:people,lang:'pl',page:'padel'},
      name:name.slice(0,80),coming:c,people:people,lang:'pl'};
    pending={name:name,coming:c,body:JSON.stringify(p)};
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    send(pending);
  });
  // warm the cache for the thank-you photo size after load
  addEventListener('load',function(){setTimeout(function(){var i=new Image();i.decoding='async';i.src='court-1200.webp'},2500)});
})();
</script>
</body>
</html>
